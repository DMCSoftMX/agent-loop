name: Preflight (reusable)

# One-shot setup validator. Run it ONCE per repo after wiring the stub:
# Actions tab -> "Agent loop" -> Run workflow. It fails LOUD and EARLY with
# remediation, instead of letting the first real `specify` die opaque.
#
# NOTE: if THIS workflow shows `startup_failure` (never runs a single step),
# that IS the diagnosis for the blocker preflight cannot see from the inside --
# the stub is missing its top-level `permissions:` block (see SETUP.md). GitHub
# evaluates permissions BEFORE any step runs, so it can't be reported from here.
# If preflight runs at all, that is already correct.
#
# SINCE v0.6.0 (ADR-0002) specs are issue comments, not a separate repo: no App,
# no cross-repo token to validate. Preflight shrank accordingly.
on:
  workflow_call:
    inputs:
      model:
        description: Claude model for the ping (per-repo override, optional).
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:            # same ceiling as the real phases -> running proves the stub grant
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---- secret present (cleaner message than a downstream 401) ----------
      - name: Secret CLAUDE_CODE_OAUTH_TOKEN is set
        id: secret
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Set it: claude setup-token | gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "FAIL secret" >> "$RUNNER_TEMP/results"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "PASS secret" >> "$RUNNER_TEMP/results"
          fi

      # ---- config: setup.env exists + required keys ------------------------
      - name: setup.env present and complete
        run: |
          if [ ! -f setup.env ]; then
            echo "::error::setup.env missing. Copy setup.env.example and fill it."
            echo "FAIL setupenv" >> "$RUNNER_TEMP/results"; exit 0
          fi
          . ./setup.env
          # STACK is the only hard requirement — it drives the toolchain step.
          if [ -z "$STACK" ]; then
            echo "::error::setup.env has no STACK (node|python|go|rust|custom). It selects the toolchain."
            echo "FAIL setupenv" >> "$RUNNER_TEMP/results"
          else
            echo "PASS setupenv" >> "$RUNNER_TEMP/results"
          fi
          # ALLOWED_VERIFY_TOOLS empty is VALID, not an error: a repo with no lint/type/test step
          # (e.g. docs-only) legitimately leaves it blank, and implement falls back to just the
          # editing tools. Warn so a real code repo notices a likely omission, but never block.
          if [ -z "$ALLOWED_VERIFY_TOOLS" ]; then
            echo "::warning::setup.env has no ALLOWED_VERIFY_TOOLS — the agent will self-verify nothing. Fine for a docs-only repo; a code repo probably wants lint/typecheck/test here."
          fi

      # ---- convention: labels exist (GitHub silently drops unknown ones) ---
      - name: Required labels exist
        run: |
          have=$(gh label list --limit 100 --json name -q '.[].name')
          for l in specify plan claude-implement no-spec task bug rework; do
            echo "$have" | grep -qx "$l" || echo "::warning::label '$l' missing (create it; GitHub silently drops unknown labels)"
          done

      # ---- convention: default branch is develop ---------------------------
      - name: Default branch is develop
        run: |
          def=$(gh api "repos/${{ github.repository }}" -q .default_branch)
          [ "$def" = "develop" ] || echo "::warning::default branch is '$def', expected 'develop' (issue triggers read from the default branch)"

      # ---- enforcement level: do the gates actually BLOCK a merge? (retro #6) --
      # "Gated PR" implies the gates stop a bad merge. They only do so if the branch is protected. The
      # default GITHUB_TOKEN cannot read the /protection DETAIL (that needs admin, which is NOT a
      # grantable workflow scope — `administration` is not a valid `permissions:` key), and on a
      # private Free repo protection is unavailable entirely. But the branch object exposes a
      # `.protected` boolean to any reader — enough to tell the owner which world they're in without
      # over-promising. We still best-effort the detail endpoint: if it happens to be readable, we
      # enrich; its 403 "upgrade" message is itself the Free-plan tell.
      - name: Gate enforcement level (advisory vs enforcing)
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"
          echo "## Gate enforcement" >> "$GITHUB_STEP_SUMMARY"
          for br in develop main; do
            b=$(gh api "repos/$repo/branches/$br" 2>/dev/null) || {
              echo "- \`$br\`: branch not found — skipped." >> "$GITHUB_STEP_SUMMARY"; continue;
            }
            protected=$(printf '%s' "$b" | jq -r '.protected // false')
            nchecks=$(printf '%s' "$b" | jq -r '((.protection.required_status_checks.contexts // .protection.required_status_checks.checks) // []) | length' 2>/dev/null || echo 0)

            # Best-effort detail read (usually 403 for GITHUB_TOKEN; its error text is informative).
            detail=$(gh api "repos/$repo/branches/$br/protection" 2>"$RUNNER_TEMP/e") && derr="" || derr=$(cat "$RUNNER_TEMP/e" 2>/dev/null || true)
            admins=$(printf '%s' "${detail:-}" | jq -r '.enforce_admins.enabled // empty' 2>/dev/null || true)

            if [ "$protected" = "true" ]; then
              if [ "$admins" = "true" ]; then
                echo "- \`$br\`: **protected & enforcing** — ${nchecks} required check(s), admins included." >> "$GITHUB_STEP_SUMMARY"
              elif [ "$admins" = "false" ]; then
                echo "- \`$br\`: **protected, admins bypass** — ${nchecks} required check(s); an \`--admin\` merge skips them." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::branch '$br' is protected but admins bypass it — an --admin merge skips every gate."
              else
                echo "- \`$br\`: **protected** — ${nchecks} required check(s); the loop token can't read admin-bypass, so confirm 'Include administrators' in Settings → Branches." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              if printf '%s' "$derr" | grep -qi 'upgrade'; then
                echo "- \`$br\`: **advisory only** — branch protection needs a paid plan on a private repo. Gates report but do NOT block the merge; the human is the gate." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::branch '$br': gates are ADVISORY (protection needs a paid plan on a private repo). The human is the merge gate."
              else
                echo "- \`$br\`: **advisory only** — not protected. Gates report but do NOT block the merge. Require ci / pr-gate / spec-guard on it to enforce." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::branch '$br' is not protected — gates are ADVISORY."
              fi
            fi
          done
          echo "_A green loop is not an enforced loop unless the branch is protected (and admins are included)._" >> "$GITHUB_STEP_SUMMARY"

      # ---- the real ping: Claude App installed AND token valid --------------
      # Reproduces the OIDC -> token exchange with a trivial prompt so the two
      # 401s that used to be buried in `is_error:true` surface as clear
      # annotations. `continue-on-error` lets us parse the output ourselves.
      - name: Claude ping (App install + token)
        id: ping
        if: steps.secret.outputs.has != 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with exactly the single word: PONG. Do nothing else."
          claude_args: "--model ${{ inputs.model }}"

      - name: Interpret ping
        if: steps.secret.outputs.has != 'false'
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          out=$(cat "$f" 2>/dev/null || echo '')
          if echo "$out" | grep -q "not installed on this repository"; then
            echo "::error::Claude GitHub App is NOT installed on this account/org. Install https://github.com/apps/claude -> your account -> this repo."
            echo "FAIL app" >> "$RUNNER_TEMP/results"
          elif echo "$out" | grep -q "Invalid bearer token"; then
            echo "::error::Token rejected (Invalid bearer token). Regenerate with 'claude setup-token' (no stray whitespace) and re-set the secret."
            echo "FAIL token" >> "$RUNNER_TEMP/results"
          elif echo "$out" | grep -qi "pong"; then
            echo "PASS ping" >> "$RUNNER_TEMP/results"
          else
            echo "::error::Ping inconclusive -- dumping execution output:"
            echo "$out"
            echo "FAIL ping" >> "$RUNNER_TEMP/results"
          fi

      # ---- gate: aggregate + write the Actions run summary -----------------
      - name: Verdict
        if: always()
        run: |
          r="$RUNNER_TEMP/results"
          touch "$r"
          {
            echo "## Preflight"
            sed 's/^PASS/- ✅/; s/^FAIL/- ❌/' "$r"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^FAIL' "$r"; then
            echo "::error::Preflight failed -- fix the ❌ items above, then re-run."
            exit 1
          fi
          echo "Preflight green -- the loop is ready."
