name: Preflight (reusable)

# One-shot setup validator. Run it ONCE per repo after wiring the stub:
# Actions tab -> "Agent loop" -> Run workflow. It fails LOUD and EARLY with
# remediation, instead of letting the first real `specify` die opaque.
#
# NOTE: if THIS workflow shows `startup_failure` (never runs a single step),
# that IS the diagnosis for the two blockers preflight cannot see from the
# inside -- the stub is missing its top-level `permissions:` block, or engine
# access isn't `organization` (see SETUP.md). GitHub evaluates permissions and
# reusable-workflow access BEFORE any step runs, so there is no way to report
# them from here. If preflight runs at all, those two are already correct.
on:
  workflow_call:
    inputs:
      model:
        description: Claude model for the ping (per-repo override, optional).
        type: string
        default: sonnet
      specs_repo:
        description: The specs repo the loop reconciles against (ADR-0001).
        type: string
        default: DMCSoftMX/specs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LOOP_APP_ID:
        required: false
      LOOP_APP_PRIVATE_KEY:
        required: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:            # same ceiling as the real phases -> running proves the stub grant
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---- secret present (cleaner message than a downstream 401) ----------
      - name: Secret CLAUDE_CODE_OAUTH_TOKEN is set
        id: secret
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Set it: claude setup-token | gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "FAIL secret" >> "$RUNNER_TEMP/results"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "PASS secret" >> "$RUNNER_TEMP/results"
          fi

      # ---- config: setup.env exists + required keys ------------------------
      - name: setup.env present and complete
        run: |
          if [ ! -f setup.env ]; then
            echo "::error::setup.env missing. Copy setup.env.example and fill it."
            echo "FAIL setupenv" >> "$RUNNER_TEMP/results"; exit 0
          fi
          . ./setup.env
          miss=""
          for k in STACK ALLOWED_VERIFY_TOOLS; do
            [ -z "${!k}" ] && miss="$miss $k"
          done
          if [ -n "$miss" ]; then
            echo "::error::setup.env is missing keys:$miss"
            echo "FAIL setupenv" >> "$RUNNER_TEMP/results"
          else
            echo "PASS setupenv" >> "$RUNNER_TEMP/results"
          fi

      # ---- cross-repo: App creds mint a token that actually reaches specs ---
      # Since v0.5.0 the spec lives in another repo (ADR-0001). This is the one
      # blocker preflight can prove end-to-end BEFORE the first `specify`: not
      # just "the secrets exist" but "the minted token can read the specs repo
      # and the template is there".
      - name: Resolve the specs repo name
        id: specsname
        env:
          SPECS_REPO: ${{ inputs.specs_repo }}
        run: printf 'name=%s\n' "${SPECS_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Cross-repo App credentials are set
        id: appsecret
        env:
          APP_ID: ${{ secrets.LOOP_APP_ID }}
          APP_KEY: ${{ secrets.LOOP_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::LOOP_APP_ID / LOOP_APP_PRIVATE_KEY not set. specify, implement and spec-guard all need a token for ${{ inputs.specs_repo }} — the default GITHUB_TOKEN is scoped to this repo only. See SETUP.md, 'GitHub App'."
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "FAIL app-creds" >> "$RUNNER_TEMP/results"
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "PASS app-creds" >> "$RUNNER_TEMP/results"
          fi

      - name: Mint cross-repo token
        id: crosstoken
        if: steps.appsecret.outputs.has == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LOOP_APP_ID }}
          private-key: ${{ secrets.LOOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            ${{ steps.specsname.outputs.name }}

      - name: Specs repo is reachable and has TEMPLATE.md
        if: steps.appsecret.outputs.has == 'true'
        env:
          TOKEN: ${{ steps.crosstoken.outputs.token }}
          SPECS_REPO: ${{ inputs.specs_repo }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not mint an installation token. Usual causes: the App is not installed on ${{ github.repository_owner }}, the installation does not include BOTH this repo and ${SPECS_REPO}, or LOOP_APP_PRIVATE_KEY is not the full PEM (BEGIN/END lines included)."
            echo "FAIL app-token" >> "$RUNNER_TEMP/results"; exit 0
          fi
          # `.permissions.push` reflects what THIS token can do, so one call covers both
          # "can I see it" and "can specify push a branch there".
          PUSH=$(GH_TOKEN="$TOKEN" gh api "repos/${SPECS_REPO}" -q .permissions.push 2>/dev/null || true)
          if [ -z "$PUSH" ]; then
            echo "::error::The token cannot read ${SPECS_REPO}. Add that repo to the App installation."
            echo "FAIL specs-access" >> "$RUNNER_TEMP/results"; exit 0
          fi
          if [ "$PUSH" != "true" ]; then
            echo "::error::The token can read ${SPECS_REPO} but not write to it. specify pushes a spec branch there — give the App 'Contents: Read and write' and 'Pull requests: Read and write'."
            echo "FAIL specs-write" >> "$RUNNER_TEMP/results"; exit 0
          fi
          if ! GH_TOKEN="$TOKEN" gh api "repos/${SPECS_REPO}/contents/templates/spec.md" -q .name >/dev/null 2>&1; then
            echo "::error::${SPECS_REPO} has no templates/spec.md — specify reads the spec template from there."
            echo "FAIL specs-template" >> "$RUNNER_TEMP/results"; exit 0
          fi
          echo "PASS specs-access" >> "$RUNNER_TEMP/results"

      # ---- convention: labels exist (GitHub silently drops unknown ones) ---
      - name: Required labels exist
        run: |
          have=$(gh label list --limit 100 --json name -q '.[].name')
          for l in specify plan claude-implement task bug rework; do
            echo "$have" | grep -qx "$l" || echo "::warning::label '$l' missing (create it; GitHub silently drops unknown labels)"
          done

      # ---- convention: default branch is develop ---------------------------
      - name: Default branch is develop
        run: |
          def=$(gh api "repos/${{ github.repository }}" -q .default_branch)
          [ "$def" = "develop" ] || echo "::warning::default branch is '$def', expected 'develop' (issue triggers read from the default branch)"

      # ---- the real ping: App installed AND token valid --------------------
      # Reproduces the OIDC -> app-token exchange with a trivial prompt so the
      # two 401s that used to be buried in `is_error:true` surface as clear
      # annotations. `continue-on-error` lets us parse the output ourselves.
      - name: Claude ping (App install + token)
        id: ping
        if: steps.secret.outputs.has != 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with exactly the single word: PONG. Do nothing else."
          claude_args: "--model ${{ inputs.model }}"

      - name: Interpret ping
        if: steps.secret.outputs.has != 'false'
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          out=$(cat "$f" 2>/dev/null || echo '')
          if echo "$out" | grep -q "not installed on this repository"; then
            echo "::error::Claude GitHub App is NOT installed on the org. Install https://github.com/apps/claude on your org -> All repositories."
            echo "FAIL app" >> "$RUNNER_TEMP/results"
          elif echo "$out" | grep -q "Invalid bearer token"; then
            echo "::error::Token rejected (Invalid bearer token). Regenerate with 'claude setup-token' (no stray whitespace) and re-set the secret."
            echo "FAIL token" >> "$RUNNER_TEMP/results"
          elif echo "$out" | grep -qi "pong"; then
            echo "PASS ping" >> "$RUNNER_TEMP/results"
          else
            echo "::error::Ping inconclusive -- dumping execution output:"
            echo "$out"
            echo "FAIL ping" >> "$RUNNER_TEMP/results"
          fi

      # ---- gate: aggregate + write the Actions run summary -----------------
      - name: Verdict
        if: always()
        run: |
          r="$RUNNER_TEMP/results"
          touch "$r"
          {
            echo "## Preflight"
            sed 's/^PASS/- ✅/; s/^FAIL/- ❌/' "$r"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^FAIL' "$r"; then
            echo "::error::Preflight failed -- fix the ❌ items above, then re-run."
            exit 1
          fi
          echo "Preflight green -- the loop is ready."
