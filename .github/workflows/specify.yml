name: Specify (reusable)

# The SPECIFY phase of the agent loop, maintained ONCE here. Projects don't copy it — their thin
# stub calls it: `uses: DMCSoftMX/agent-loop/.github/workflows/specify.yml@vX`. The trigger
# (issues: labeled) and the label guard live in the STUB (see stubs/loop.yml); this file is pure
# logic.
#
# SINCE v0.6.0 (ADR-0002): the spec is a CANONICAL COMMENT on the issue, not a file in a dedicated
# repo. Everything happens in THIS repo with the default GITHUB_TOKEN — no App, no cross-repo token,
# no cross-account tax. The agent authors the spec to a file; a deterministic step upserts it as the
# issue comment marked `<!-- agent-spec:<n> -->` (re-running specify edits that same comment in place
# instead of spamming). The spec template is inlined in the prompt (pinned with @vX, which for a
# small reviewed artifact is the right side of the trade).
on:
  workflow_call:
    inputs:
      model:
        description: Claude model for this phase (per-repo override, optional).
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  specify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # only reads CLAUDE.md for conventions
      pull-requests: write   # claude-code-action expects it available on issue events
      issues: write          # posts / updates the spec comment
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The agent AUTHORS the spec to a file and nothing else — no git, no gh. A deterministic step
      # below posts it as the issue comment. Same author-vs-plumbing split the loop uses everywhere:
      # it keeps the agent out of the sandbox's gated git/gh and makes the outcome deterministic.
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: "true"
          prompt: |
            You are a SPECIFY agent (SDD phase 1). Capture INTENT as a durable artifact.
            Do NOT design the solution and do NOT write product code.

            Your ONE deliverable is a single file on disk: `SPEC_DRAFT.md` at the repo root. Do NOT
            run any `git` or `gh` commands and do NOT post any comment yourself — an automated step
            after you publishes the file as the issue's spec comment. Just write the file.

            1. Read the issue that triggered this event (it was labeled `specify`) and its comments.
               Read `CLAUDE.md` (repo root) for the project's conventions.
            2. Fill the template below: keep EVERY heading, replace EVERY `<<...>>` placeholder with
               real content, and drop the `<!-- ... -->` guidance comments. Set **Repo** to
               `${{ github.repository }}` and **Refs** to
               `${{ github.repository }}#${{ github.event.issue.number }}`.
            3. Keep "Approach & tasks" light. If it starts needing real architecture, new contracts
               or a data model, do NOT expand it — note under "Open questions" that this needs the
               `plan` escalation. A crisp issue can yield a short spec, but it must be an artifact.
            4. Write the filled spec to EXACTLY `SPEC_DRAFT.md` (repo root) and nothing else.

            ----- spec template (fill and write to SPEC_DRAFT.md) -----
            # Spec: <<title>>

            > **Repo:** ${{ github.repository }}  ·  **Refs:** ${{ github.repository }}#${{ github.event.issue.number }}  ·  **Status:** draft → approved (al añadir `claude-implement`)
            > El QUÉ y el PORQUÉ, más un **CÓMO ligero**. Para trabajo pesado o transversal, escala el
            > diseño a un `plan.md` con la etiqueta `plan` — si no, déjalo inline aquí abajo.

            ## Problem / motivation

            <<Qué necesidad o problema existe hoy, y por qué importa. 1–3 oraciones.>>

            ## Goal

            <<El resultado en una oración. Qué es verdad cuando esto está hecho.>>

            ## Scope

            **In:**
            - <<qué cubre este trabajo>>

            **Out (non-goals):**
            - <<qué explícitamente NO cubre>>

            ## User-visible behavior

            <<Cómo lo observa un usuario / caller / consumidor. Antes → después.>>

            ## Acceptance criteria

            <!-- Específicos y VERIFICABLES: esto es contra lo que review compara el PR; lo que quede
                 sin cubrir es BLOQUEANTE. Prefiere resultados observables sobre implementación. -->
            - [ ] <<criterio 1>>
            - [ ] <<criterio 2>>
            - [ ] CI verde (según los comandos de setup.env)
            - [ ] Respeta las convenciones de CLAUDE.md

            ## Approach & tasks

            <!-- CÓMO ligero: enfoque en unas líneas + un checklist corto. Si empieza a necesitar
                 arquitectura real, contratos o un modelo de datos, PARA y escala a plan.md. -->
            <<una o dos oraciones sobre el enfoque; nombra los archivos/áreas principales>>

            - [ ] <<tarea 1>>
            - [ ] <<tarea 2>>

            ## Edge cases & risks

            - <<caso borde / modo de falla / comportamiento que CI no puede verificar>>

            ## Open questions

            - <<lo que necesita una decisión humana antes o durante la implementación>>
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools Write

      # --- deterministic publish: upsert the spec as the issue's canonical comment ---------------
      - name: Post or update the spec comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # Assertion (retro #2): a green run must mean the artifact exists. If specify produced
          # nothing, fail loud instead of pretending it worked.
          if [ ! -s SPEC_DRAFT.md ]; then
            echo "::error::specify produced no SPEC_DRAFT.md. See the agent's progress comment on issue #${ISSUE}."
            exit 1
          fi

          MARKER="<!-- agent-spec:${ISSUE} -->"

          # Build the comment body: hidden marker (how implement/spec-guard find it) + a human note +
          # the spec. This whole body is what the pin hashes, so keep the note stable.
          BODY_FILE="$RUNNER_TEMP/spec_comment.md"
          {
            printf '%s\n' "$MARKER"
            printf '> 📋 **Spec** — edítalo aquí mismo si hace falta; el hash del comentario es el pin. Para construir, añade la label `claude-implement` (o `no-spec` para implementar sin spec).\n\n'
            cat SPEC_DRAFT.md
          } > "$BODY_FILE"

          # Find an existing spec comment (upsert). jq reads the marker from the environment.
          CID=$(MARKER="$MARKER" gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate \
                  --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty')

          if [ -n "$CID" ]; then
            jq -n --rawfile b "$BODY_FILE" '{body:$b}' \
              | gh api --method PATCH "repos/${REPO}/issues/comments/${CID}" --input - >/dev/null
            echo "Updated spec comment ${CID} on issue #${ISSUE}."
          else
            jq -n --rawfile b "$BODY_FILE" '{body:$b}' \
              | gh api --method POST "repos/${REPO}/issues/${ISSUE}/comments" --input - >/dev/null
            echo "Posted spec comment on issue #${ISSUE}."
          fi

      # Surface permission_denials_count (retro #3). The comment-upsert above already fails hard if
      # SPEC_DRAFT.md is missing; this just flags a partial run where the agent was blocked mid-draft.
      - name: Surface permission denials
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          f="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          [ -f "$f" ] || exit 0
          denials=$(jq -r '[.. | objects | .permission_denials_count? // empty] | last // empty' "$f" 2>/dev/null || true)
          if [ -z "${denials:-}" ]; then
            denials=$(grep -oE '"permission_denials_count"[[:space:]]*:[[:space:]]*[0-9]+' "$f" | grep -oE '[0-9]+' | tail -n1 || true)
          fi
          [ -n "${denials:-}" ] || denials=0
          echo "- permission_denials_count: **${denials}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${denials}" -gt 0 ] 2>/dev/null; then
            echo "::warning::specify hit ${denials} permission denial(s) — the spec draft may be incomplete. Check the run."
          fi
