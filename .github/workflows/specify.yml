name: Specify (reusable)

# The SPECIFY phase of the agent loop, maintained ONCE here. Projects don't copy it — their thin
# stub calls it: `uses: DMCSoftMX/agent-loop/.github/workflows/specify.yml@vX`. The trigger
# (issues: labeled) and the label guard live in the STUB (see stubs/loop.yml); this file is pure
# logic. The spec TEMPLATE is INLINED in the prompt below, so this reusable needs NO checkout of
# this (private) engine repo — the caller repo's own default token is enough. The template is
# versioned with this file: whatever `@vX` the stub pins, that's the template you get.
on:
  workflow_call:
    inputs:
      model:
        description: Claude model for this phase (per-repo override, optional).
        type: string
        default: claude-sonnet-4-6
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  specify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # commits the spec on a branch in the CALLER repo
      pull-requests: write  # opens the spec PR
      issues: write         # progress comment (track_progress)
      id-token: write
    steps:
      # The CALLER repo — where CLAUDE.md lives and where the spec PR is created.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # REQUIRED for issue events: without this the agent runs but does NOT post progress.
          track_progress: "true"
          prompt: |
            You are a SPECIFY agent (SDD phase 1). Capture INTENT as a durable artifact.
            Do NOT design the solution and do NOT write product code.

            1. Read the issue that triggered this event (it was labeled `specify`) and any
               discussion in its comments. Read CLAUDE.md (repo root) for conventions.
            2. Author a spec at `specs/${{ github.event.issue.number }}-<short-kebab-slug>/spec.md`
               using EXACTLY the template below. Keep every heading; replace every `<<...>>`
               placeholder with real content (set Refs to #${{ github.event.issue.number }}):

               ===== BEGIN spec.md TEMPLATE =====
               # Spec: <<title>>

               > **Refs:** #<<issue>>  ·  **Status:** draft → approved (on merge)
               > The WHAT and WHY, plus a **lightweight HOW**. For heavy or cross-cutting work,
               > escalate the design to a full `plan.md` via the `plan` label — otherwise keep it
               > inline below.

               ## Problem / motivation

               <<What need or problem exists today, and why it matters. 1–3 sentences.>>

               ## Goal

               <<The outcome in one sentence. What is true when this is done.>>

               ## Scope

               **In:**
               - <<what this work covers>>

               **Out (non-goals):**
               - <<what this work explicitly does NOT cover>>

               ## User-visible behavior

               <<How the change is observed by a user / caller / consumer. Before → after.>>

               ## Acceptance criteria

               <!-- Specific and VERIFIABLE. This is what review checks the PR against; anything
                    left uncovered is BLOCKING. Prefer observable outcomes over implementation. -->

               - [ ] <<criterion 1>>
               - [ ] <<criterion 2>>
               - [ ] CI green (lint · typecheck · test · build)
               - [ ] Follows the conventions in CLAUDE.md

               ## Approach & tasks

               <!-- Lightweight HOW: the intended approach in a few lines + a short task checklist.
                    Enough for the implementer not to guess. If this section starts needing real
                    architecture, contracts or a data model, STOP and escalate to plan.md. -->

               <<one or two sentences on the intended approach; name the main files/areas>>

               - [ ] <<task 1>>
               - [ ] <<task 2>>

               ## Edge cases & risks

               - <<edge case / failure mode / runtime behavior CI can't verify>>

               ## Open questions

               - <<anything that needs a human decision before/while implementing>>
               ===== END spec.md TEMPLATE =====

            3. Keep "Approach & tasks" light: if it starts needing real architecture, new contracts
               or a data model, do NOT expand it — note under "Open questions" that this needs the
               `plan` escalation. If the issue is already crisp the spec can be short, but it must
               be an artifact.
            4. Create a branch `spec/${{ github.event.issue.number }}-<slug>`, commit ONLY the new
               file under `specs/`, and open a PR against `develop` with body
               `Refs #${{ github.event.issue.number }}` (NOT `Fixes` — merging the spec must not
               close the issue). Title: `spec: <goal> (#${{ github.event.issue.number }})`.
          claude_args: |
            --model ${{ inputs.model }}
