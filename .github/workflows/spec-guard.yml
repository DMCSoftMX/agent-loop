name: Spec Guard (reusable)

# Anti-drift gate on PRs into develop.
#
# SINCE v0.6.0 (ADR-0002) the spec is a COMMENT on the issue, and the pin `.specs/<n>.ref` is a
# CONTENT HASH of that comment (not a git sha). This guard:
#
#   1. If the linked issue has a spec comment, the PR must carry `.specs/<issue#>.ref` pinning it.
#   2. Re-fetches the comment and re-hashes it; the hash must still match the pin.
#
# The `no-spec` label on the linked issue waives BOTH (issue #13): it means the same thing here as
# in `implement` — "this issue's PRs don't pin a spec" — so a specified issue can still be resolved
# by hand. Waiving drift protection is the point of the label, not a loophole.
#
# Rule 2 is the forcing function: if a human edits the spec comment after the code was written, the
# hash changes, every open code PR pinned to the old hash goes red, and someone has to look at the
# code again before merging.
#
# Reads only the issue comment via the default GITHUB_TOKEN — no App, no cross-repo token. A welcome
# side effect vs v0.5.x: this gate is secret-free again, so it WORKS ON FORK PRs (public repos).
on:
  workflow_call: {}

jobs:
  spec-guard:
    name: spec-guard
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the PR pins the current spec comment
        env:
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          N=$(printf '%s' "$BODY" | grep -oiE '(fix(es|ed)?|close[sd]?|resolve[sd]?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -z "$N" ]; then echo "No linked issue — nothing to guard."; exit 0; fi

          # `no-spec` waives the guard (issue #13): the error below advertises the label as the
          # escape hatch, so it must actually BE one — same meaning as in `implement`. Fail-closed:
          # if the labels can't be read, the guard stays on.
          LABELS=$(gh api "repos/${REPO}/issues/${N}" --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
          if printf '%s' ",$LABELS," | grep -q ',no-spec,'; then
            echo "Issue #${N} is labeled 'no-spec' — spec pin waived, nothing to guard."
            exit 0
          fi

          MARKER="<!-- agent-spec:${N} -->"
          SPEC_CID=$(MARKER="$MARKER" gh api "repos/${REPO}/issues/${N}/comments" --paginate \
                       --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty' 2>/dev/null || true)
          REF=".specs/${N}.ref"

          if [ ! -f "$REF" ]; then
            if [ -n "$SPEC_CID" ]; then
              echo "::error::Issue #${N} has a spec comment but this PR does not pin it. Expected ${REF} — re-run \`claude-implement\`, or add the 'no-spec' label to the issue if it is intentionally spec-less."
              exit 1
            fi
            echo "No spec comment for issue #${N} and no pin — nothing to guard."
            exit 0
          fi

          # Parse, never source: this file comes from the PR branch, and sourcing it would execute
          # whatever an author put in it.
          val () { grep -m1 "^$1=" "$REF" | cut -d= -f2- || true; }
          PIN_SRC=$(val source); PIN_CID=$(val comment_id); PIN_SHA=$(val spec_sha256)

          if [ "$PIN_SRC" != "issue-comment" ]; then
            echo "::error::${REF} has source='${PIN_SRC}', expected 'issue-comment' (v0.6.x). Re-run \`claude-implement\` to re-pin."
            exit 1
          fi
          if ! printf '%s' "$PIN_CID" | grep -qE '^[0-9]+$'; then
            echo "::error::${REF} has a malformed comment_id: '${PIN_CID}'."
            exit 1
          fi
          if ! printf '%s' "$PIN_SHA" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::${REF} has a malformed spec_sha256: '${PIN_SHA}'."
            exit 1
          fi

          # Re-fetch the pinned comment. Same hash pipeline as implement.yml — keep them identical.
          if ! gh api "repos/${REPO}/issues/comments/${PIN_CID}" --jq '.body' > "$RUNNER_TEMP/now" 2>/dev/null; then
            echo "::error::The pinned spec comment (id ${PIN_CID}) no longer exists on ${REPO}. Re-run \`specify\` + \`claude-implement\` to re-pin."
            exit 1
          fi
          NOW_SHA=$(tr -d '\r' < "$RUNNER_TEMP/now" | sha256sum | cut -d' ' -f1)

          if [ "$PIN_SHA" = "$NOW_SHA" ]; then
            echo "Pin is current (issue #${N}, comment ${PIN_CID} @ sha256:${PIN_SHA})."
            exit 0
          fi

          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*-[[:space:]]*\[x\][[:space:]].*spec.*(accurate|unchanged|up[- ]?to[- ]?date)'; then
            echo "::warning::The spec comment changed (pin ${PIN_SHA} != now ${NOW_SHA}) but the PR attests the code is still accurate. Allowing."
            exit 0
          fi

          echo "::error::The spec comment changed after this PR was written. See https://github.com/${REPO}/issues/${N}#issuecomment-${PIN_CID} — reconcile the code, then re-run \`claude-implement\` to re-pin (or tick the 'spec is still accurate' box in the PR body)."
          exit 1
