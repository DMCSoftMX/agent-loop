name: Claude interactive (reusable)

# Interactive @claude. The action auto-detects the mode from the inherited comment event (no
# `prompt:`). Reads the caller's setup.env for the stack + self-verify commands. The @claude
# mention guard lives in the project stub.
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load stack config from setup.env
        run: |
          set -a; source setup.env 2>/dev/null || true; set +a
          for v in STACK INSTALL_CMD ALLOWED_VERIFY_TOOLS; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done

      - if: env.STACK == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: env.STACK == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: env.STACK == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - if: env.STACK == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - if: env.INSTALL_CMD != ''
        run: ${{ env.INSTALL_CMD }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools ${{ env.ALLOWED_VERIFY_TOOLS }}
            --append-system-prompt "If a spec exists for this work under specs/<issue#>-*/ , treat spec.md as the source of truth (meet its acceptance criteria) and follow plan.md/tasks.md when present, ticking off tasks as you go. Dependencies are already installed on the runner. Before opening the PR, verify your change by running the project's lint, typecheck and test commands; if anything fails, fix it and re-run until it passes. Do NOT run the build (slow; CI validates it). If after several attempts something is still red, open the PR anyway but state explicitly what is failing and why."
