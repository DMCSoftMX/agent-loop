name: Claude interactive (reusable)

# Interactive @claude. The action auto-detects the mode from the inherited comment event (no
# `prompt:`). Reads the caller's setup.env for the stack + self-verify commands. The @claude
# mention guard lives in the project stub.
#
# SINCE v0.5.0 (ADR-0001) specs live in the specs repo. This phase is the ad-hoc escape hatch and
# is often used where no spec exists at all, so the specs checkout is BEST EFFORT: if the App
# credentials are missing it still runs, just without spec context.
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      specs_repo:
        description: The specs repo (system of record), mounted read-only for context.
        type: string
        default: DMCSoftMX/specs
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LOOP_APP_ID:
        required: false
      LOOP_APP_PRIVATE_KEY:
        required: false

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      # The `secrets` context is not usable in a step-level `if:`, so hoist the test here.
      HAS_APP: ${{ secrets.LOOP_APP_ID != '' && secrets.LOOP_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Resolve the specs repo name
        id: specs
        env:
          SPECS_REPO: ${{ inputs.specs_repo }}
        run: printf 'name=%s\n' "${SPECS_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint cross-repo token
        id: token
        if: env.HAS_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.LOOP_APP_ID }}
          private-key: ${{ secrets.LOOP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.specs.outputs.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/checkout@v4
        if: steps.token.outputs.token != ''
        continue-on-error: true
        with:
          repository: ${{ inputs.specs_repo }}
          path: .specs-repo
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 1

      # `.specs-repo/` sits inside the working tree; without this an eager `git add` would drag
      # it in as a gitlink. Local-only, so it never dirties the repo.
      - name: Keep the specs checkout out of the code repo
        run: printf '/.specs-repo/\n' >> .git/info/exclude

      - name: Load stack config from setup.env
        run: |
          set -a; source setup.env 2>/dev/null || true; set +a
          for v in STACK INSTALL_CMD ALLOWED_VERIFY_TOOLS; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          # @claude may be asked to edit code, so always include the editing tools.
          # `--allowedTools` sets the exact allowlist (read-only base aside), so passing only
          # the verify commands would drop Write/Edit and the agent couldn't change any file.
          BASE="Edit,Write,MultiEdit"
          if [ -n "$ALLOWED_VERIFY_TOOLS" ]; then
            printf 'AGENT_TOOLS=%s,%s\n' "$BASE" "$ALLOWED_VERIFY_TOOLS" >> "$GITHUB_ENV"
          else
            printf 'AGENT_TOOLS=%s\n' "$BASE" >> "$GITHUB_ENV"
          fi

      - if: env.STACK == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: env.STACK == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: env.STACK == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - if: env.STACK == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - if: env.INSTALL_CMD != ''
        run: ${{ env.INSTALL_CMD }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools ${{ env.AGENT_TOOLS }}
            --append-system-prompt "Specs live in a separate repo, mounted read-only at .specs-repo/ (absent if unavailable). If this work maps to an issue #N, look for .specs-repo/specs/${{ github.event.repository.name }}/N-*/ ; if found, treat spec.md as the source of truth (meet its acceptance criteria) and follow plan.md/tasks.md when present. NEVER edit or commit anything under .specs-repo/ — it is another repository; report needed spec changes instead. Dependencies are already installed on the runner. Before opening the PR, verify your change by running the project's lint, typecheck and test commands; if anything fails, fix it and re-run until it passes. Do NOT run the build (slow; CI validates it). If after several attempts something is still red, open the PR anyway but state explicitly what is failing and why."
