name: Plan (reusable)

# OPTIONAL deep-design escalation (SDD). Same shape as specify: the agent authors a design and a
# deterministic step upserts it as the issue's canonical PLAN comment, marked `<!-- agent-plan:<n> -->`.
# The `plan` label guard lives in the project stub.
#
# SINCE v0.6.0 (ADR-0002): plan is a comment on the issue, next to the spec comment — no dedicated
# repo, no cross-repo token. `implement` reads both; the plan SUPERSEDES the spec's light approach.
on:
  workflow_call:
    inputs:
      model:
        description: Claude model for this phase.
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write   # claude-code-action expects it available on issue events
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Require an existing spec comment: plan escalates a spec, it doesn't replace specify.
      - name: Require an approved spec comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- agent-spec:${ISSUE} -->"
          CID=$(MARKER="$MARKER" gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate \
                  --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty')
          if [ -z "$CID" ]; then
            echo "::error::Issue #${ISSUE} has no spec comment to escalate. Run \`specify\` first, then \`plan\`."
            exit 1
          fi
          # Hand the spec to the agent as read-only context.
          gh api "repos/${REPO}/issues/comments/${CID}" --jq '.body' > "$RUNNER_TEMP/spec.md"
          echo "Spec comment ${CID} available at \$RUNNER_TEMP/spec.md"

      # The agent AUTHORS the plan to a file; the step below upserts it as the plan comment.
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: "true"
          prompt: |
            You are a DEEP PLAN agent (optional escalation for heavy work). Turn the approved spec
            into a full technical design that supersedes its lightweight "Approach & tasks". Do NOT
            write product code.

            The approved spec is at `${{ runner.temp }}/spec.md` (read-only context). Read it and
            `CLAUDE.md` (repo root) for conventions and the code being designed for.

            Your ONE deliverable is a single file on disk: `PLAN_DRAFT.md` at the repo root. Do NOT
            run any `git` or `gh` commands and do NOT post any comment yourself — an automated step
            after you publishes it as the issue's plan comment. Fill the template below: keep every
            heading, replace every `<<...>>`, drop the `<!-- -->` comments.

            The plan must be CONCRETE: real affected files, contracts / interfaces / data shapes,
            risks + mitigations, and a test strategy mapping each acceptance criterion to how it will
            be proven (flag what CI can't verify). Do NOT restate the spec; design against it. If the
            spec is wrong or ambiguous, say so under "Open questions" rather than guessing.

            ----- plan template (fill and write to PLAN_DRAFT.md) -----
            # Plan: <<title>>

            > **Refs:** ${{ github.repository }}#${{ github.event.issue.number }} · supersedes the spec's "Approach & tasks".

            ## Design

            <<El enfoque técnico concreto: qué cambia y por qué. Archivos/módulos afectados.>>

            ## Contracts & data shapes

            <<Interfaces, tipos, endpoints, esquemas — lo que otro código consume o produce.>>

            ## Risks & mitigations

            - <<riesgo → mitigación>>

            ## Test strategy

            <<Cada criterio de aceptación → cómo se prueba. Marca lo que CI no puede verificar.>>

            ## Tasks

            <!-- Checklist ordenado de tareas discretas e individualmente verificables. -->
            - [ ] <<tarea 1>>
            - [ ] <<tarea 2>>

            ## Open questions

            - <<lo que necesita decisión humana>>
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools Write

      - name: Post or update the plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ ! -s PLAN_DRAFT.md ]; then
            echo "::error::plan produced no PLAN_DRAFT.md. See the agent's progress comment on issue #${ISSUE}."
            exit 1
          fi

          MARKER="<!-- agent-plan:${ISSUE} -->"
          BODY_FILE="$RUNNER_TEMP/plan_comment.md"
          {
            printf '%s\n' "$MARKER"
            printf '> 🧭 **Plan** — supersede el enfoque ligero del spec. Editable aquí; añade `claude-implement` para construir.\n\n'
            cat PLAN_DRAFT.md
          } > "$BODY_FILE"

          CID=$(MARKER="$MARKER" gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate \
                  --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty')
          if [ -n "$CID" ]; then
            jq -n --rawfile b "$BODY_FILE" '{body:$b}' \
              | gh api --method PATCH "repos/${REPO}/issues/comments/${CID}" --input - >/dev/null
            echo "Updated plan comment ${CID} on issue #${ISSUE}."
          else
            jq -n --rawfile b "$BODY_FILE" '{body:$b}' \
              | gh api --method POST "repos/${REPO}/issues/${ISSUE}/comments" --input - >/dev/null
            echo "Posted plan comment on issue #${ISSUE}."
          fi

      # Surface permission_denials_count (retro #3). The upsert above fails hard on a missing
      # PLAN_DRAFT.md; this flags a partial run where the agent was blocked mid-draft.
      - name: Surface permission denials
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          f="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          [ -f "$f" ] || exit 0
          denials=$(jq -r '[.. | objects | .permission_denials_count? // empty] | last // empty' "$f" 2>/dev/null || true)
          if [ -z "${denials:-}" ]; then
            denials=$(grep -oE '"permission_denials_count"[[:space:]]*:[[:space:]]*[0-9]+' "$f" | grep -oE '[0-9]+' | tail -n1 || true)
          fi
          [ -n "${denials:-}" ] || denials=0
          echo "- permission_denials_count: **${denials}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${denials}" -gt 0 ] 2>/dev/null; then
            echo "::warning::plan hit ${denials} permission denial(s) — the plan draft may be incomplete. Check the run."
          fi
