name: Review (reusable)

# Automatic PR review anchored to the spec. Read-only. Called by the stub on `pull_request`
# (NOT pull_request_target → fork PRs never see the secret). Emits a machine-readable verdict.
#
# SINCE v0.6.0 (ADR-0002) the spec is an issue comment. Review finds it through the PR's own pin
# (`.specs/<issue#>.ref` → comment_id) and fetches that comment for context — no App, no specs repo.
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Best-effort: resolve the pinned spec comment into a file for the agent. If there is no pin
      # (spec-less PR), the agent falls back to the linked issue body.
      - name: Resolve the spec comment for context
        id: spec
        env:
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          N=$(printf '%s' "$BODY" | grep -oiE '(fix(es|ed)?|close[sd]?|resolve[sd]?)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          REF=".specs/${N}.ref"
          if [ -z "$N" ] || [ ! -f "$REF" ]; then
            printf 'found=false\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          CID=$(grep -m1 '^comment_id=' "$REF" | cut -d= -f2- || true)
          if [ -n "$CID" ] && gh api "repos/${REPO}/issues/comments/${CID}" --jq '.body' > "$RUNNER_TEMP/spec.md" 2>/dev/null; then
            printf 'found=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: "true"
          prompt: |
            Review this pull request. PRIMARY goal: verify it RESOLVES the issue it links
            (`Fixes #N` / `Closes #N`).

            Spec available for context: `${{ steps.spec.outputs.found }}`.
            - If `true`: the approved spec is at `${{ runner.temp }}/spec.md` (the exact version the
              code was pinned to). Its acceptance criteria are the CONTRACT — check the PR against
              every one; anything left uncovered is BLOCKING.
            - If `false`: fall back to the linked issue body and its acceptance criteria.

            Then review conventions (per CLAUDE.md), bugs, edge cases and error handling.

            You run in CI without a browser: do NOT treat runtime-dependent behavior as verified;
            ask for human verification. Be concise and distinguish BLOCKING from optional. If
            everything is fine, say so.

            END your review with exactly one machine-readable line, on its own:
            `REVIEW-VERDICT: BLOCK` if there is any blocking issue, otherwise
            `REVIEW-VERDICT: PASS`. Do not omit it or add text after it.
          claude_args: |
            --model ${{ inputs.model }}
