name: Implement (reusable)

# The agent implements against the spec; a deterministic step then OPENS the PR and asserts it
# exists (issue #12) — the agent has no Bash/gh, so it can only commit a branch, and a green run
# must mean "the PR exists", not "a branch exists somewhere". Reads the caller's setup.env for the
# stack + self-verify commands (installs deps, self-verifies before the PR). The `claude-implement`
# label guard lives in the project stub.
#
# SINCE v0.6.0 (ADR-0002): the spec is a CANONICAL COMMENT on the issue, marked `<!-- agent-spec:<n> -->`.
# A deterministic step resolves it, hands it to the agent read-only, and writes the pin
# `.specs/<n>.ref` — a CONTENT HASH of the comment (not a git sha). `spec-guard` re-fetches the
# comment and re-hashes to detect drift. All in THIS repo with GITHUB_TOKEN — no App, no cross-repo.
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Deterministic: resolve the spec comment, write the pin, hand the spec to the agent. The pin
      # is a CONTENT HASH so spec-guard can reconcile against the live comment later.
      - name: Resolve the spec comment and write the pin
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- agent-spec:${ISSUE} -->"

          LABELS=$(gh api "repos/${REPO}/issues/${ISSUE}" --jq '[.labels[].name] | join(",")')

          # Fail-closed (retro #4): a spec-driven issue with no approved spec must NOT silently fall
          # back to the issue body. The only opt-out is the explicit `no-spec` label.
          if printf '%s' ",$LABELS," | grep -q ',no-spec,'; then
            echo "::notice::'no-spec' label present — implementing from the issue body, no pin."
            printf 'found=false\n' >> "$GITHUB_OUTPUT"
            printf 'has_plan=false\n' >> "$GITHUB_OUTPUT"
            printf 'ref=(no pin)\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CID=$(MARKER="$MARKER" gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate \
                  --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty')
          if [ -z "$CID" ]; then
            echo "::error::No spec comment on issue #${ISSUE}. Run \`specify\` first (label 'specify') and review it, or add the 'no-spec' label to implement without a spec."
            exit 1
          fi

          # Fetch the comment body ONCE and hash it. This pipeline (jq .body | tr -d CR | sha256sum)
          # MUST be byte-for-byte identical to spec-guard's, or the pin will never reconcile.
          gh api "repos/${REPO}/issues/comments/${CID}" --jq '.body' > "$RUNNER_TEMP/spec.md"
          HASH=$(tr -d '\r' < "$RUNNER_TEMP/spec.md" | sha256sum | cut -d' ' -f1)

          mkdir -p .specs
          {
            printf 'source=issue-comment\n'
            printf 'issue=%s\n'       "$ISSUE"
            printf 'comment_id=%s\n'  "$CID"
            printf 'spec_sha256=%s\n' "$HASH"
            printf 'captured=%s\n'    "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ".specs/${ISSUE}.ref"

          echo "Spec comment ${CID} @ sha256:${HASH}"
          printf 'found=true\n'                 >> "$GITHUB_OUTPUT"
          printf 'ref=.specs/%s.ref\n' "$ISSUE" >> "$GITHUB_OUTPUT"

          # Optional deep plan, if `plan` ran. It supersedes the spec's light approach.
          PMARKER="<!-- agent-plan:${ISSUE} -->"
          PID=$(MARKER="$PMARKER" gh api "repos/${REPO}/issues/${ISSUE}/comments" --paginate \
                  --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | last // empty')
          if [ -n "$PID" ]; then
            gh api "repos/${REPO}/issues/comments/${PID}" --jq '.body' > "$RUNNER_TEMP/plan.md"
            printf 'has_plan=true\n' >> "$GITHUB_OUTPUT"
            echo "Plan comment ${PID} available."
          else
            printf 'has_plan=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Load stack config from setup.env
        run: |
          set -a; source setup.env 2>/dev/null || true; set +a
          for v in STACK INSTALL_CMD ALLOWED_VERIFY_TOOLS; do
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          # The agent MUST be able to edit files, so always include the editing tools.
          # `--allowedTools` sets the exact allowlist (read-only base aside), so passing only the
          # verify commands would drop Write/Edit and the agent couldn't implement anything.
          BASE="Edit,Write,MultiEdit"
          if [ -n "$ALLOWED_VERIFY_TOOLS" ]; then
            printf 'AGENT_TOOLS=%s,%s\n' "$BASE" "$ALLOWED_VERIFY_TOOLS" >> "$GITHUB_ENV"
          else
            printf 'AGENT_TOOLS=%s\n' "$BASE" >> "$GITHUB_ENV"
          fi

      - if: env.STACK == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: env.STACK == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: env.STACK == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - if: env.STACK == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - if: env.INSTALL_CMD != ''
        run: ${{ env.INSTALL_CMD }}

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NO github_token input here, unlike the other phases (issue #12): omitting it makes the
          # action mint a Claude App installation token (preflight guarantees the App is installed)
          # and expose it in outputs. The publish step below opens the PR with THAT token — a PR
          # created with the default GITHUB_TOKEN would never trigger the `pull_request` gates
          # (GitHub suppresses recursive workflow triggers for it).
          track_progress: "true"
          prompt: |
            Implement the issue that triggered this event (it was labeled `claude-implement`). An
            automated step AFTER you opens the Pull Request — you author the code and the PR body.

            1. SOURCE OF TRUTH. Spec found for this issue: `${{ steps.spec.outputs.found }}`.
               - If `true`: read `${{ runner.temp }}/spec.md` — the approved spec (a read-only copy
                 of the issue's spec comment). Its acceptance criteria are what your PR must meet and
                 its "Approach & tasks" is your guide. Deep plan present: `${{ steps.spec.outputs.has_plan }}`;
                 if `true`, also read `${{ runner.temp }}/plan.md`, which SUPERSEDES the spec's light
                 approach. Do NOT edit those files; they are context, not part of the repo.
               - If `false`: there is no approved spec (the issue is `no-spec`); fall back to the
                 issue body and its acceptance criteria.
            2. Follow the project conventions described in CLAUDE.md.
            3. Dependencies are ALREADY installed on the runner. BEFORE opening the PR, verify your
               change by running the project's lint / typecheck / test commands; if anything fails,
               fix it and retry until it passes. Do NOT run the build (slow; CI validates it). If
               something is still red, open the PR anyway but state explicitly what is failing.
            4. Create a branch and commit your code. If a spec was found, the pin file
               `${{ steps.spec.outputs.ref }}` has ALREADY been written for you — `git add` it and
               include it in the SAME commit as the code. It records the exact spec-comment version
               you worked against; `spec-guard` fails the PR without it.
            5. Do NOT open the PR and do NOT post a compare link — the automated step after you
               opens it against `develop` and links it to this issue. Your last deliverable is the
               PR body: write it to EXACTLY `${{ runner.temp }}/PR_BODY.md`. Summarize which
               "Approach & tasks" items you completed and which you did not, and call out anything
               still red. Do NOT include a "Fixes #" line — the publish step adds it.
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools ${{ env.AGENT_TOOLS }}

      # --- deterministic publish (issue #12): open the PR and assert it exists ------------------
      # Same author-vs-plumbing split as specify/plan: the agent authors (code + PR body file),
      # this step publishes. Before it, a green implement could leave an orphaned branch behind a
      # "Create PR" link nobody clicked — work committed, no gates ever run, nothing red anywhere.
      - name: Open the PR and assert it exists
        env:
          # The App token minted by the action (see above). Falls back to GITHUB_TOKEN so a
          # missing mint still produces the PR — with a loud warning, because the gates won't
          # auto-run on it.
          GH_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
          APP_TOKEN: ${{ steps.claude.outputs.github_token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euo pipefail

          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::The action minted no App token — opening the PR with GITHUB_TOKEN. The gates will NOT auto-run on it; close/reopen the PR (or push to it) to trigger them."
          fi

          # The action reports the branch it created; fall back to the newest claude/issue-<n>-*
          # branch (the name embeds a timestamp, so the lexicographic max is the newest).
          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh api "repos/${REPO}/git/matching-refs/heads/claude/issue-${ISSUE}-" \
                       --jq '[.[].ref | sub("^refs/heads/"; "")] | sort | last // empty')
          fi
          if [ -z "$BRANCH" ]; then
            echo "::error::implement produced no branch for issue #${ISSUE} — the agent committed nothing. See its progress comment on the issue."
            exit 1
          fi

          # Idempotent on re-runs: if the branch already has an open PR, the artifact exists.
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH} — nothing to do."
            exit 0
          fi

          # The agent authors the body; the `Fixes #<n>` line is OURS to guarantee — spec-guard
          # and the issue autolink depend on it, so it is never left to the author.
          FINAL="$RUNNER_TEMP/pr_body_final.md"
          {
            printf 'Fixes #%s\n\n' "$ISSUE"
            if [ -s "$RUNNER_TEMP/PR_BODY.md" ]; then
              cat "$RUNNER_TEMP/PR_BODY.md"
            else
              echo "_The agent wrote no PR body — see its progress comment on issue #${ISSUE} for what was done._"
            fi
          } > "$FINAL"

          TITLE=$(gh api "repos/${REPO}/issues/${ISSUE}" --jq .title)
          URL=$(gh pr create --repo "$REPO" --base develop --head "$BRANCH" \
                  --title "$TITLE" --body-file "$FINAL")
          echo "Opened ${URL} (head ${BRANCH})."

      # Surface permission_denials_count (retro #3): if the agent was blocked mid-run it may have
      # skipped an intended edit or commit while still reporting green. Warn loud; the pin/PR
      # assertions above already fail hard on a missing artifact.
      - name: Surface permission denials
        if: always()
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          f="${EXEC:-/home/runner/work/_temp/claude-execution-output.json}"
          [ -f "$f" ] || exit 0
          denials=$(jq -r '[.. | objects | .permission_denials_count? // empty] | last // empty' "$f" 2>/dev/null || true)
          if [ -z "${denials:-}" ]; then
            denials=$(grep -oE '"permission_denials_count"[[:space:]]*:[[:space:]]*[0-9]+' "$f" | grep -oE '[0-9]+' | tail -n1 || true)
          fi
          [ -n "${denials:-}" ] || denials=0
          # Report the count (diagnostic), don't scream: agents routinely probe Bash/gh/CI tools they
          # aren't granted, so a per-run warning would cry wolf. The artifact assertions above are the
          # real guard. A high or rising count here is a hint the agent is fighting its sandbox.
          echo "- permission_denials_count: **${denials}**" >> "$GITHUB_STEP_SUMMARY"
